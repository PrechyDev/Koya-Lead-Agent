{#- The two exports (D-93): disabled, with the reason, when the run has no leads. Needs: run, has_leads, size. -#}
{% if has_leads %}
<a class="btn {{ size }}" href="/runs/{{ run.id }}/export.csv" title="Every lead in this run, for a spreadsheet or CRM">Download CSV</a>
<a class="btn {{ size }}" href="/runs/{{ run.id }}/export.json" title="The objective, the ICP, each lead's evidence and sources, and the approved drafts">Download sample pack (JSON)</a>
{% else %}
<span class="btn {{ size }}" aria-disabled="true" aria-describedby="no-export-{{ size or 'lg' }}">Download CSV</span>
<span class="btn {{ size }}" aria-disabled="true" aria-describedby="no-export-{{ size or 'lg' }}">Download sample pack (JSON)</span>
<span id="no-export-{{ size or 'lg' }}" class="disabled-reason">Nothing to export: this run has no leads.</span>
{% endif %}
