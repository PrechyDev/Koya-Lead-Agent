{#- The export (D-100): the outreach sample pack as one CSV; disabled, with the reason, when there are no leads.
    Needs: run, has_leads, size. -#}
{% if has_leads %}
<a class="btn {{ size }}" href="/runs/{{ run.id }}/export.csv" title="Each qualified lead: the objective, the company and its LinkedIn, the qualification reasoning with sources, the review status and the approved drafts">Download CSV</a>
{% else %}
<span class="btn {{ size }}" aria-disabled="true" aria-describedby="no-export-{{ size or 'lg' }}">Download CSV</span>
<span id="no-export-{{ size or 'lg' }}" class="disabled-reason">Nothing to export: this run has no qualified leads.</span>
{% endif %}
