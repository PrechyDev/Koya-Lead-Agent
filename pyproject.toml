[project]
name = "koya-lead-agent"
version = "0.1.0"
description = "AI lead research & outreach drafting agent for Koya Talent (Claude Agent SDK)."
requires-python = ">=3.12,<3.13"
dependencies = [
  "claude-agent-sdk>=0.2.158",
  "anthropic>=1.8",
  "apify-client>=3.2",
  "httpx>=0.27",
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "jinja2>=3.1",
  "python-multipart>=0.0.9",
  "psycopg[binary,pool]>=3.2",
  "pydantic>=2.8",
  "pydantic-settings>=2.4",
  "python-dotenv>=1.0",
  "tldextract>=5.1",
  "pycountry>=24.6",
  "slowapi>=0.1.9",
  "pyjwt[crypto]>=2.9",
  "itsdangerous>=2.2",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.24", "respx>=0.21", "ruff>=0.6"]

[tool.setuptools]
packages = []

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
markers = [
  "db: needs a real database (SUPABASE_ADMIN_DSN / SUPABASE_DB_DSN in .env)",
]
filterwarnings = ["ignore::DeprecationWarning"]

[tool.ruff]
line-length = 110
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["E501"]

[tool.ruff.lint.flake8-bugbear]
# FastAPI declares parameters with Depends()/Form()/Query() defaults; that is the framework's design.
extend-immutable-calls = ["fastapi.Depends", "fastapi.Form", "fastapi.Query"]
